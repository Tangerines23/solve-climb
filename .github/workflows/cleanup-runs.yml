name: Cleanup Old Workflow Runs

on:
  schedule:
    # 매일 자정 (UTC 00:00 = KST 09:00) 실행
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete cancelled or old workflow runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const daysToKeep = 3;
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - daysToKeep);

            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const runs = response.data.workflow_runs;
            console.log(`Total workflow runs fetched: ${runs.length}`);
            let deletedCount = 0;

            for (const run of runs) {
              const createdAt = new Date(run.created_at);
              // 자동 취소되었거나 3일 경과한 완료된 런 항목 삭제
              const shouldDelete = run.status === 'completed' && (run.conclusion === 'cancelled' || createdAt < cutoffDate);

              if (shouldDelete) {
                try {
                  console.log(`Deleting run ID ${run.id} (${run.name}) - Conclusion: ${run.conclusion}`);
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                  deletedCount++;
                } catch (err) {
                  console.error(`Failed to delete run ${run.id}: ${err.message}`);
                }
              }
            }

            console.log(`Cleanup finished. Deleted ${deletedCount} workflow runs.`);
